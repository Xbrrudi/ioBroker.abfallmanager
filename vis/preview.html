<!doctype html><html lang="de"><meta charset="utf-8"><title>Abfallmanager – VIS-Vorschau</title><style>body{background:linear-gradient(#101923,#273e49);color:white;font:16px Arial;margin:0}header{padding:15px;background:#1119}.stage{position:relative;height:75vh;overflow:hidden;background:linear-gradient(175deg,#18212b 0 55%,#444 56%,#333 100%)}.bin{position:absolute;bottom:8%;height:36%;filter:drop-shadow(8px 7px 5px #0008)}.bin img{height:100%;width:100%;object-fit:contain}.bin[hidden]{display:none}label{margin:8px;display:inline-block}</style><header><strong>Abfallmanager – Darstellungsvorschau</strong><p>Nur lokale HTML-Vorschau, noch kein natives VIS-2-Widget.</p><label><input type="checkbox" id="gelb" checked>Gelb</label><label><input type="checkbox" id="rest" checked>Rest</label><label><input type="checkbox" id="bio">Bio</label><label><input type="checkbox" id="papier">Papier</label><label>Größe <input id="size" type="range" min="15" max="65" value="36"></label></header><div class="stage" id="stage"></div><script>const stage=document.querySelector('#stage');const types=['gelb','rest','bio','papier'];types.forEach((id,i)=>{const el=document.createElement('div');el.className='bin';el.style.left=(12+i*21)+'%';el.innerHTML='<img alt="'+id+'" src="../www/'+id+'.png">';stage.append(el);document.getElementById(id).addEventListener('change',()=>{el.hidden=!document.getElementById(id).checked});el.hidden=!document.getElementById(id).checked});document.querySelector('#size').addEventListener('input',e=>document.querySelectorAll('.bin').forEach(el=>el.style.height=e.target.value+'%'));</script></html>
